  *{box-sizing:border-box;margin:0}
  html,body{min-height:100%}
  body{
    font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
    font-weight:900;
    color:var(--white);
    background:
      radial-gradient(55% 35% at 50% 0%, rgba(125,255,42,.20), transparent 70%),
      radial-gradient(60% 40% at 90% 30%, rgba(244,169,71,.22), transparent 70%),
      radial-gradient(70% 50% at 5% 95%, rgba(120,60,200,.40), transparent 70%),
      linear-gradient(165deg, var(--plum), var(--night) 65%);
    background-attachment:fixed;
    display:flex;justify-content:center;
    padding:48px 20px 80px;
  }
  main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:26px}

  .logo{
    width:150px;height:150px;border-radius:50%;
    display:grid;place-items:center;
    background:linear-gradient(145deg,rgba(255,255,255,.45),rgba(255,255,255,.06));
    border:1.5px solid rgba(255,255,255,.65);
    box-shadow:0 10px 40px rgba(244,169,71,.40), inset 0 2px 8px rgba(255,255,255,.7), inset 0 -10px 20px rgba(0,0,0,.25);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    position:relative;overflow:hidden;
  }
  .logo::after{
    content:"";position:absolute;top:-30%;left:-20%;width:140%;height:55%;
    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));
    border-radius:50%;transform:rotate(-8deg);pointer-events:none;
  }
  .logo .pic{width:130px;height:130px;position:relative;z-index:1;background:var(--dog) center/contain no-repeat}

  h1{
    font-size:clamp(42px,14vw,62px);
    font-weight:900;letter-spacing:1px;line-height:1;
    color:var(--white);
    -webkit-text-stroke:7px var(--ink);
    paint-order:stroke fill;
    text-shadow:0 6px 0 rgba(0,0,0,.4);
  }
  .tag{
    font-size:clamp(17px,5.4vw,22px);font-weight:900;text-align:center;line-height:1.15;
    color:var(--white);
    -webkit-text-stroke:5px var(--ink);
    paint-order:stroke fill;
    margin-top:-10px;
  }
  .tag b{
    color:var(--neon);font-weight:900;
    text-shadow:0 0 14px rgba(125,255,42,.85), 0 3px 0 rgba(0,0,0,.4);
  }

  .stage{width:100%;position:relative;padding:34px 0 60px}
  .dog{
    position:absolute;left:50%;top:50%;
    width:300px;height:300px;margin:-150px 0 0 -150px;
    background:var(--dog) center/contain no-repeat;z-index:0;pointer-events:none;
    filter:drop-shadow(0 10px 24px rgba(0,0,0,.5));
  }
  .links{position:relative;z-index:1;width:100%;display:flex;flex-direction:column;gap:16px}
  .link{
    position:relative;overflow:hidden;
    display:flex;align-items:center;gap:16px;
    padding:18px 22px;border-radius:22px;
    text-decoration:none;color:var(--white);
    font-size:20px;font-weight:900;
    background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.06));
    border:1.5px solid rgba(255,255,255,.55);
    box-shadow:0 8px 28px rgba(0,0,0,.4), inset 0 1.5px 4px rgba(255,255,255,.7), inset 0 -8px 16px rgba(0,0,0,.2);
    backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);
    transition:transform .15s ease;
  }
  .link::before{
    content:"";position:absolute;inset:0 0 50% 0;
    background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));
    border-radius:22px 22px 60% 60%/22px 22px 24px 24px;pointer-events:none;
  }
  .link:hover{transform:translateY(-3px)}
  .link:active{transform:scale(.98)}
  .link:focus-visible{outline:3px solid var(--neon);outline-offset:3px}
  .link .ico{
    flex:none;width:48px;height:48px;border-radius:14px;
    display:grid;place-items:center;position:relative;z-index:1;
    border:2px solid var(--ink);
    box-shadow:inset 0 2px 4px rgba(255,255,255,.6);
  }
  .link .ico svg{width:26px;height:26px}
  .link span{position:relative;z-index:1;text-shadow:0 2px 6px rgba(0,0,0,.55)}
  .yt .ico{background:#ff0000}
  .wa .ico{background:#25d366}
  .tw .ico{background:#9146ff}
  .pp .ico{background:#0070e0}
  .tw .ico{background:#9146ff}
  .pp .ico{background:#fff}
  .pp .ico svg{width:30px;height:30px}

  @media (prefers-reduced-motion:no-preference){
    .dog{animation:play 4.5s ease-in-out infinite}
    @keyframes play{
      0%,100%{transform:translate(-8px,0) rotate(-3deg)}
      50%{transform:translate(8px,-10px) rotate(3deg)}
    }
  }
</style>
